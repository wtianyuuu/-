            0% {

            25% {
                transform: translateX(-10px);
            }

            50% {
                transform: translateX(10px);

            75% {

            100% {

        <script>
            function heartFirework(event) {
                const x = event.clientX;
                const y = event.clientY;

                for (let i = 0; i < 70; i++) {
                    const heart = document.createElement("div");
                    heart.className = "particle";
                    heart.innerText = "💗";

                    heart.style.left = x + "px";
                    heart.style.top = y + "px";

                    const angle = Math.random() * Math.PI * 2;
                    const distance = Math.random() * 280 + 80;

                    const moveX = Math.cos(angle) * distance;
                    const moveY = Math.sin(angle) * distance;

                    heart.style.setProperty("--x", moveX + "px");
                    heart.style.setProperty("--y", moveY + "px");

                    heart.style.fontSize = Math.random() * 22 + 12 + "px";
                    heart.style.animationDuration = Math.random() * 0.6 + 1 + "s";

                    document.body.appendChild(heart);

                    // 拖尾粒子
                    for (let j = 0; j < 6; j++) {
                        setTimeout(() => {
                            const trail = document.createElement("div");
                            trail.className = "trail";

                            const progress = j / 6;
                            trail.style.left = x + moveX * progress + "px";
                            trail.style.top = y + moveY * progress + "px";

                            trail.style.width = Math.random() * 5 + 3 + "px";
                            trail.style.height = trail.style.width;

                            document.body.appendChild(trail);

                            setTimeout(() => {
                                trail.remove();
                            }, 800);
                        }, j * 60);
                    }

                    setTimeout(() => {
                        heart.remove();
                    }, 1600);
                }
            }
